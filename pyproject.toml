[project]
name = "whispertray"
version = "1.2.0"
description = "Privacy-aware desktop dictation for Windows, macOS, and Linux."
requires-python = ">=3.10"
authors = [{ name = "KROU4" }]

[tool.briefcase]
project_name = "WhisperTray"
bundle = "com.whispertray"
version = "1.2.0"
url = "https://github.com/KROU4/Whisper-Tray"
license = { file = "LICENSE" }
author = "KROU4"

[tool.briefcase.app.whispertray]
formal_name = "WhisperTray"
description = "Privacy-aware desktop dictation."
long_description = """
WhisperTray is a cross-platform desktop dictation application with a local
privacy profile and an optional Groq speed profile. It provides a global
hotkey, microphone selection, visible recording status, and native desktop
integration.
"""
sources = [
    "src/whispertray", "autostart.py", "config_store.py", "core.py", "credentials.py",
    "diagnostics.py", "file_transcriber.py", "history_store.py", "hotkey.py",
    "logging_setup.py", "main.py", "platform_integration.py", "recorder.py",
    "transcriber.py", "ui.py", "assets", "jobs.py", "inference_worker.py", "version.py",
]
test_sources = ["release_smoke/tests"]
requires = [
    "faster-whisper==1.1.1", "groq==0.15.0", "keyring==25.7.0",
    "numpy==2.2.2", "pynput==1.8.2", "pyperclip==1.11.0", "PySide6-Essentials==6.8.1",
    "requests==2.34.2", "sounddevice==0.5.1",
]
icon = "assets/whispertray"
requirement_installer_args = ["--constraint", "./requirements.txt"]

[tool.briefcase.app.whispertray.windows]
# Widget-only application: preserve Qt GUI, software rendering, images, styles,
# all native speech dependencies and licenses. Never blanket-remove DLLs.
cleanup_paths = [
    "src/app_packages/PySide6/include", "src/app_packages/PySide6/typesystems",
    "src/app_packages/PySide6/glue", "src/app_packages/PySide6/doc",
    "src/app_packages/PySide6/metatypes", "src/app_packages/PySide6/qml",
    "src/app_packages/PySide6/scripts", "src/app_packages/PySide6/*.pyi",
    "src/app_packages/PySide6/*.exe", "src/app_packages/PySide6/*.lib",
    "src/app_packages/PySide6/QtQml*.pyd", "src/app_packages/PySide6/Qt6Qml*.dll",
    "src/app_packages/PySide6/QtQuick*.pyd", "src/app_packages/PySide6/Qt6Quick*.dll",
    "src/app_packages/PySide6/QtDesigner.pyd", "src/app_packages/PySide6/Qt6Designer*.dll",
    "src/app_packages/PySide6/QtHelp.pyd", "src/app_packages/PySide6/Qt6Help.dll",
    "src/app_packages/PySide6/QtSql.pyd", "src/app_packages/PySide6/Qt6Sql.dll",
    "src/app_packages/PySide6/QtTest.pyd", "src/app_packages/PySide6/Qt6Test.dll",
    "src/app_packages/PySide6/QtUiTools.pyd", "src/app_packages/PySide6/Qt6UiTools.dll",
    "src/app_packages/PySide6/QtOpenGL.pyd", "src/app_packages/PySide6/QtOpenGLWidgets.pyd",
    "src/app_packages/PySide6/plugins/designer", "src/app_packages/PySide6/plugins/qmltooling",
    "src/app_packages/PySide6/plugins/sqldrivers", "src/app_packages/numpy/**/tests",
]

[tool.briefcase.app.whispertray.macOS]
min_os_version = "12.0"
# Only the post-package test bundle needs Apple's stdout/stderr bridge.
test_requires = ["std-nslog==1.0.3"]

[tool.briefcase.app.whispertray.linux.system.ubuntu.noble]
# Native Qt plugins and PortAudio are loaded dynamically; Briefcase cannot
# infer their Debian runtime dependencies from the launcher alone.
system_runtime_requires = [
    "libportaudio2", "libegl1", "libgl1", "libdbus-1-3", "libfontconfig1",
    "libglib2.0-0t64", "libx11-xcb1", "libxkbcommon-x11-0", "libxcb-cursor0",
    "libxcb-icccm4", "libxcb-keysyms1", "libxcb-randr0", "libxcb-shape0",
    "libxcb-sync1", "libxcb-xfixes0",
]

# Briefcase builds matching-host artifacts: Windows MSI, macOS DMG/PKG and
# Briefcase builds native packages on their matching host operating system.

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", "dist", "artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
