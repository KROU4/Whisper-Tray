name: Bug report
description: Report a reproducible WhisperTray problem without sensitive data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach audio, transcript text, API keys, or unreviewed logs.
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, macOS Intel, macOS Apple Silicon, Linux X11, Linux Wayland]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WhisperTray version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
