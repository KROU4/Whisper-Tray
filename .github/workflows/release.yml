name: Release native installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows-msi
            python-version: "3.11"
          - os: macos-latest
            platform: macOS
            artifact: macos-installers
            python-version: "3.11"
          - os: ubuntu-latest
            platform: linux
            artifact: linux-package
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libportaudio2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m briefcase create ${{ matrix.platform }} --no-input
      - if: matrix.platform == 'windows'
        run: python tools/add_windows_desktop_shortcut.py
      - run: python -m briefcase build ${{ matrix.platform }} --no-input
      - if: matrix.platform == 'windows'
        run: python -m briefcase package windows --no-input
      - if: matrix.platform == 'macOS'
        run: |
          python -m briefcase package macOS -p dmg --adhoc-sign --no-input
          python -m briefcase package macOS -p pkg --adhoc-sign --no-input
      - if: matrix.platform == 'linux'
        run: python -m briefcase package linux --no-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
