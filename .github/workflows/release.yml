name: Release native installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows-msi
          - os: macos-latest
            platform: macOS
            artifact: macos-installers
          - os: ubuntu-latest
            platform: linux
            artifact: linux-package
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m briefcase create ${{ matrix.platform }} --no-input
      - if: matrix.platform == 'windows'
        run: python tools/add_windows_desktop_shortcut.py
      - run: python -m briefcase build ${{ matrix.platform }} --no-input
      - if: matrix.platform == 'windows'
        run: python -m briefcase package windows --no-input
      - if: matrix.platform == 'macOS'
        run: |
          python -m briefcase package macOS -p dmg --adhoc-sign --no-input
          python -m briefcase package macOS -p pkg --adhoc-sign --no-input
      - if: matrix.platform == 'linux'
        run: python -m briefcase package linux --no-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
