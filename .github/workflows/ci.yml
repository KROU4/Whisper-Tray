name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libportaudio2
      - name: Install test dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q .
      - name: Static analysis
        run: ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Verify no tracked secrets or runtime data
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(config\.json|.*\.log)$'; then exit 1; fi
          if git grep -n -I -E 'gsk_[A-Za-z0-9]{20,}'; then exit 1; fi
          while read -r commit; do
            if git grep -I -q -E 'gsk_[A-Za-z0-9]{20,}' "$commit"; then
              echo "Possible plaintext Groq key found in Git history."
              exit 1
            fi
          done < <(git rev-list --all)
